<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>rtcstats dumps (demo)</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    table { border-collapse: collapse; }
    th, td { padding: 0.3em 1em; text-align: left; }
    tr:nth-child(even) { background-color: #f0f0f0; }
  </style>
</head>
<body>
  <h1>rtcstats dumps (demo)</h1>
  <p>A dump is completed when the browser tab is closed.</p>
  <table>
    <thead>
      <tr>
        <th>Started</th><th>Ended</th><th>Room</th><th>Name</th>
        <th>Meeting ID</th><th>Size</th><th></th><th></th>
      </tr>
    </thead>
    <tbody id="dumps"></tbody>
  </table>

  <script type="module">
    const FILES = '/rtcstats-dumps/files/';
    const VIEWER = '/rtcstats-viewer/dump-importer/?dump=';

    // The second line of a dump is the metadata. Its url is the room path.
    // The file is written when the dump ends, so its mtime is the end time.
    // The Jitsi identity is in the ":jitsi" event which is added after the
    // join. It is usually in the beginning of the dump, so only the first part
    // of the file is read.
    async function getInfo(name) {
      const info = {};

      try {
        const response = await fetch(FILES + name, {
          headers: {Range: 'bytes=0-65535'},
        });
        const lines = (await response.text()).split('\n');
        const metadata = JSON.parse(lines[1]);
        info.room = metadata.url.replace(/^\/rtcstats\//, '');
        info.started = new Date(metadata.startTime).toLocaleString();

        const line = lines.find(l => l.startsWith('[":jitsi",'));
        Object.assign(info, JSON.parse(line)[2]);
      } catch (e) {
        // Keep what is found so far.
      }

      return info;
    }

    function addCell(row, text, href) {
      const cell = row.insertCell();

      if (href) {
        const link = document.createElement('a');

        link.href = href;
        link.textContent = text;
        cell.appendChild(link);
      } else {
        cell.textContent = text;
      }

      return cell;
    }

    const response = await fetch(FILES);
    const files = (await response.json())
      .filter(f => f.type === 'file')
      .sort((a, b) => new Date(b.mtime) - new Date(a.mtime));
    const tbody = document.getElementById('dumps');

    for (const f of files) {
      const row = tbody.insertRow();

      const startedCell = addCell(row, '...');
      addCell(row, new Date(f.mtime).toLocaleString());
      const roomCell = addCell(row, '...');
      const nameCell = addCell(row, '...');
      const meetingCell = addCell(row, '...');
      addCell(row, Math.ceil(f.size / 1024) + ' KB');
      addCell(row, 'View', VIEWER + encodeURIComponent(f.name));
      addCell(row, 'Download', FILES + encodeURIComponent(f.name));

      getInfo(encodeURIComponent(f.name)).then(info => {
        startedCell.textContent = info.started || '-';
        roomCell.textContent = info.room || '-';
        nameCell.textContent = info.displayName || '-';
        meetingCell.textContent = info.meetingId || '-';
      });
    }
  </script>
</body>
</html>
