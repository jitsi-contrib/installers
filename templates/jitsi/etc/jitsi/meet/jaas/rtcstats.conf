    # rtcstats (demo only, no authentication)
    location ^~ /rtcstats/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1d;
        tcp_nodelay on;
    }

    location = /rtcstats-client.js {
        alias /home/rtcstats/rtcstats-client.js;
    }

    location ^~ /rtcstats-dumps/ {
        alias /home/rtcstats/upload/;
        autoindex on;
        default_type application/octet-stream;
    }

    location ^~ /rtcstats-viewer/dump-importer/ {
        alias /home/rtcstats/rtcstats/dump-importer/;
    }

    location ^~ /rtcstats-viewer/packages/rtcstats-shared/ {
        alias /home/rtcstats/rtcstats/packages/rtcstats-shared/;
    }
